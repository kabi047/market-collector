name: daily-session

on:
  schedule:
    - cron: '30 2 * * 1-5' # 08:00 IST
    - cron: '45 2 * * 1-5' # 08:15 IST retry; reuse a valid session
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-zerodha-session
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
      ZERODHA_API_SECRET: ${{ secrets.ZERODHA_API_SECRET }}
      ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
      ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
      ZERODHA_TOTP_SECRET: ${{ secrets.ZERODHA_TOTP_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ${{ secrets.HF_REPO }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh scheduled session
        if: github.event_name != 'workflow_dispatch'
        run: python collect.py cloud-login
      - name: Test fresh unattended login
        if: github.event_name == 'workflow_dispatch'
        run: python collect.py cloud-login --force
      - name: Verify cloud quotes and Nifty 50 coverage
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from mdc import kite_auth, universe, hf_sync, config as C
          kite, _ = kite_auth.get_kite()
          u = universe.build(kite)
          stocks = [s for s in u['stocks'] if s['list'] == 'nifty50']
          assert len(stocks) == 50, 'Incomplete Nifty 50 coverage'
          quotes = kite.quote(['NSE:' + s['symbol'] for s in stocks])
          assert len(quotes) == 50, 'Missing company quotes'
          assert all(len(q.get('depth', {}).get(side, [])) == 5
                     for q in quotes.values() for side in ('buy', 'sell'))
          f = C.STATE / 'cloud_preflight.json'
          f.write_text(json.dumps({'checked_at': C.now_ist().isoformat(),
                                   'companies': len(quotes), 'depth_levels': 5}))
          assert hf_sync.upload(f, 'state/cloud_preflight.json'), 'Storage write failed'
          print('PASS: 50 Nifty companies, five-level depth, private cloud storage')
          PY
